name: SURFACE Audit quality gates

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dependencies, Prisma and Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://surfaceaudit:placeholder@127.0.0.1:5432/surface_audit?schema=public
      SURFACE_AUDIT_ENABLE_LOCAL_API: "false"
      NEXT_PUBLIC_SURFACE_AUDIT_STORAGE_MODE: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check dependency security
        run: npm audit --audit-level=moderate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Preview baseline migration SQL for versioned history
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/surface-audit-baseline.sql
          echo "__BEGIN_SURFACE_SQL__"
          cat /tmp/surface-audit-baseline.sql
          echo "__END_SURFACE_SQL__"
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build

  postgres-integration:
    name: PostgreSQL persistence smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: surface_audit_ci
          POSTGRES_USER: surfaceaudit_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surfaceaudit_ci -d surface_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      DATABASE_URL: postgresql://surfaceaudit_ci:ci_only_password@127.0.0.1:5432/surface_audit_ci?schema=public
      SURFACE_AUDIT_ENABLE_LOCAL_API: "true"
      NEXT_PUBLIC_SURFACE_AUDIT_STORAGE_MODE: postgres
      SURFACE_AUDIT_ADMIN_USERNAME: local-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Create isolated test schema
        run: npx prisma db push --skip-generate
      - name: Seed test-only operators and roles
        run: node scripts/seed-ci-operators.mjs
      - name: Validate audit persistence over HTTP
        run: node scripts/smoke-db.mjs
