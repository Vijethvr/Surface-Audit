name: SURFACE Audit quality gates

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dependencies, Prisma and Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://surfaceaudit:placeholder@127.0.0.1:5432/surface_audit?schema=public
      SURFACE_AUDIT_ENABLE_LOCAL_API: "false"
      NEXT_PUBLIC_SURFACE_AUDIT_STORAGE_MODE: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check dependency security
        run: npm audit --audit-level=moderate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build

  postgres-integration:
    name: PostgreSQL persistence smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: surface_audit_ci
          POSTGRES_USER: surfaceaudit_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surfaceaudit_ci -d surface_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      DATABASE_URL: postgresql://surfaceaudit_ci:ci_only_password@127.0.0.1:5432/surface_audit_ci?schema=public
      SURFACE_AUDIT_ENABLE_LOCAL_API: "true"
      NEXT_PUBLIC_SURFACE_AUDIT_STORAGE_MODE: postgres
      SURFACE_AUDIT_ADMIN_USERNAME: local-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Exercise v1.3 baseline compatibility before upgrading
        run: |
          mkdir -p prisma/_ci_upgrade/migrations
          cp prisma/schema.prisma prisma/_ci_upgrade/schema.prisma
          cp prisma/migrations/migration_lock.toml prisma/_ci_upgrade/migrations/migration_lock.toml
          cp -R prisma/migrations/20261125164000_initial_baseline prisma/_ci_upgrade/migrations/
          npx prisma migrate deploy --schema prisma/_ci_upgrade/schema.prisma
      - name: Apply v1.4 additive upgrade migration
        run: npx prisma migrate deploy
      - name: Verify migration/schema drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Verify migration ledger
        run: npx prisma migrate status
      - name: Inspect disposable database adoption status
        run: node scripts/inspect-local-db.mjs
      - name: Seed test-only operators and roles
        run: node scripts/seed-ci-operators.mjs
      - name: Provision least-privilege PostgreSQL runtime account
        run: node scripts/ci-provision-runtime-role.mjs
      - name: Verify restricted runtime PostgreSQL permissions
        env:
          DATABASE_URL: postgresql://surfaceaudit_app_ci:ci_only_app_password@127.0.0.1:5432/surface_audit_ci?schema=public
        run: node scripts/check-db-privileges.mjs
      - name: Validate audit persistence over HTTP under restricted DB account
        env:
          DATABASE_URL: postgresql://surfaceaudit_app_ci:ci_only_app_password@127.0.0.1:5432/surface_audit_ci?schema=public
        run: node scripts/smoke-db.mjs
      - name: Verify offline Ed25519 dossier signatures and reject forged exports
        run: node scripts/test-dossier-signatures.mjs /tmp/surface-audit-ci-sealed-dossier.json
      - name: Select PostgreSQL 16 clients from the service container image
        run: |
          mkdir -p /tmp/surface-audit-pg16-tools
          for tool in pg_dump pg_restore psql; do
            cat > "/tmp/surface-audit-pg16-tools/$tool" <<'WRAPPER'
          #!/usr/bin/env bash
          exec docker run --rm --network host --user "$(id -u):$(id -g)" -e PGPASSWORD -e PGOPTIONS -e PGCONNECT_TIMEOUT -v /tmp:/tmp postgres:16 "$(basename "$0")" "$@"
          WRAPPER
            chmod +x "/tmp/surface-audit-pg16-tools/$tool"
          done
          echo "/tmp/surface-audit-pg16-tools" >> "$GITHUB_PATH"
          /tmp/surface-audit-pg16-tools/pg_dump --version
      - name: Validate local configuration and refuse unsafe bind address
        run: |
          node scripts/local-preflight.mjs
          if SURFACE_AUDIT_BIND_HOST=0.0.0.0 node scripts/local-preflight.mjs; then
            echo "ERROR: unsafe wildcard bind was accepted"
            exit 1
          fi
      - name: Backup, tamper-detect and restore populated PostgreSQL into a new DB
        env:
          PGPASSWORD: ci_only_password
          SURFACE_AUDIT_BACKUP_PASSPHRASE: CI-only-long-random-passphrase-2026
        run: |
          set -euo pipefail
          node scripts/local-recovery.mjs backup /tmp/surface-audit-ci-recovery
          node scripts/local-recovery.mjs verify /tmp/surface-audit-ci-recovery
          cp /tmp/surface-audit-ci-recovery/surface-audit.backup /tmp/surface-audit-ci-recovery/untampered.backup
          printf damaged >> /tmp/surface-audit-ci-recovery/surface-audit.backup
          if node scripts/local-recovery.mjs verify /tmp/surface-audit-ci-recovery; then
            echo "ERROR: tampered backup was accepted"
            exit 1
          fi
          mv /tmp/surface-audit-ci-recovery/untampered.backup /tmp/surface-audit-ci-recovery/surface-audit.backup
          psql -h 127.0.0.1 -p 5432 -U surfaceaudit_ci -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE surface_audit_restore_ci OWNER surfaceaudit_ci'
          before=$(psql -h 127.0.0.1 -U surfaceaudit_ci -d surface_audit_ci -At -v ON_ERROR_STOP=1 \
            -c "SELECT concat_ws('|',(SELECT count(*) FROM \"Audit\"),(SELECT count(*) FROM \"AuditEvent\"),(SELECT count(*) FROM \"AuditReview\"),(SELECT count(*) FROM \"EvidenceAsset\"),(SELECT count(*) FROM \"AuditReportSnapshot\"),(SELECT md5(coalesce(string_agg(id || ':' || md5(encode(bytes,'hex')), ',' ORDER BY id),'')) FROM \"EvidenceAsset\") )")
          node scripts/local-recovery.mjs restore /tmp/surface-audit-ci-recovery surface_audit_restore_ci --confirm=surface_audit_restore_ci
          after=$(psql -h 127.0.0.1 -U surfaceaudit_ci -d surface_audit_restore_ci -At -v ON_ERROR_STOP=1 \
            -c "SELECT concat_ws('|',(SELECT count(*) FROM \"Audit\"),(SELECT count(*) FROM \"AuditEvent\"),(SELECT count(*) FROM \"AuditReview\"),(SELECT count(*) FROM \"EvidenceAsset\"),(SELECT count(*) FROM \"AuditReportSnapshot\"),(SELECT md5(coalesce(string_agg(id || ':' || md5(encode(bytes,'hex')), ',' ORDER BY id),'')) FROM \"EvidenceAsset\") )")
          test "$before" = "$after"
          if node scripts/local-recovery.mjs restore /tmp/surface-audit-ci-recovery surface_audit_restore_ci --confirm=surface_audit_restore_ci; then
            echo "ERROR: nonempty target restore was accepted"
            exit 1
          fi
          echo "PASS: populated database, event history, sealed report and attached evidence restored with matching counts and checksums"
          node scripts/secure-backup.mjs seal /tmp/surface-audit-ci-recovery /tmp/surface-audit-ci-secured
          node scripts/secure-backup.mjs unseal /tmp/surface-audit-ci-secured /tmp/surface-audit-ci-unsealed
          node scripts/local-recovery.mjs verify /tmp/surface-audit-ci-unsealed
          cmp /tmp/surface-audit-ci-unsealed/surface-audit.backup /tmp/surface-audit-ci-recovery/surface-audit.backup
          if SURFACE_AUDIT_BACKUP_PASSPHRASE=incorrect-long-test-passphrase node scripts/secure-backup.mjs unseal /tmp/surface-audit-ci-secured /tmp/surface-audit-ci-wrongpass; then
            echo "ERROR: wrong passphrase was accepted"
            exit 1
          fi
          cp -r /tmp/surface-audit-ci-secured /tmp/surface-audit-ci-secured-tampered
          printf damaged >> /tmp/surface-audit-ci-secured-tampered/surface-audit.vault
          if node scripts/secure-backup.mjs unseal /tmp/surface-audit-ci-secured-tampered /tmp/surface-audit-ci-tampered; then
            echo "ERROR: tampered encrypted backup was accepted"
            exit 1
          fi
          echo "PASS: authenticated encrypted backup, decrypted restore source, incorrect password and tampering rejection"

